<style>
  :root { color-scheme:light dark; font-family:system-ui,-apple-system,sans-serif }
  * { box-sizing:border-box } body { margin:0; background:#f4f4f2; color:#171717 }

<main>
  <header><h1>v0.56.3 更新說明</h1><p class="meta">Infinite Studio · 發布日期：2026-10-30</p></header>
  <section><h2>更新內容</h2><p>雲端儲存狀態整合至「更新至雲端」按鈕，不再顯示額外的狀態圖示按鈕。</p></section>
  <section><h2>修正</h2><p>已儲存、尚未儲存、上傳中、需要重新連結及失敗等狀態可從同一個按鈕辨識。</p></section>
  <section><h2>注意事項</h2><p>按鈕仍用來上傳目前內容；詳細的 Google Drive 狀態與檔案可從主選單的「我的 Moodboards」查看。</p></section>
  <section><h2>回復與備份</h2><p>本次只調整狀態顯示，不變更既有儲存與復原機制。</p></section>
  <footer><a href="../">回到 Infinite Studio</a></footer>
