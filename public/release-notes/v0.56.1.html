<style>

<main>
  <header><h1>v0.56.1 更新說明</h1><p class="meta">Infinite Studio · 發布日期：2026-10-30</p></header>
  <section><h2>更新內容</h2><ul><li>主選單移至右上角，左側顯示 Infinite Studio 名稱。</li><li>帳號與設定集中在同一個入口，訪客也能調整設定。</li><li>側欄圓點把手可點擊開合、拖曳調整寬度，並避開尺規；雙擊把手或在「工作區」設定中恢復預設寬度。</li></ul></section>
  <section><h2>修正</h2><p>避免帳號與設定出現重複的入口。</p></section>
  <section><h2>注意事項</h2><p>行動版可從「更多功能」進入帳號與設定。</p></section>
  <section><h2>回復與備份</h2><p>側欄寬度是此裝置的介面偏好，不會變更作品內容。</p></section>
