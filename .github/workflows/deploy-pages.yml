name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read release version
        id: release-version
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: npm test
      - name: Build GitHub Pages site
        run: npm run build
        env:
          VITE_BASE_PATH: /
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public update channel
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          UPDATE_MANIFEST_URL: https://moodboard.petfashion.tw/infinite-moodboard-update.json
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            manifest_file="${RUNNER_TEMP}/infinite-moodboard-update.json"
            if curl --fail --silent --show-error --location \
              --header "Cache-Control: no-cache, no-store" \
              "${UPDATE_MANIFEST_URL}?deployment=${GITHUB_SHA}-${attempt}" \
              --output "$manifest_file"; then
              actual_version="$(node -e 'try { const data = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(String(data.version || "")); } catch {}' "$manifest_file")"
              if [[ "$actual_version" == "$EXPECTED_VERSION" ]]; then
                echo "Public update channel reports v${actual_version}."
                exit 0
              fi
              echo "Attempt ${attempt}: expected v${EXPECTED_VERSION}, received v${actual_version:-unknown}."
            fi
            sleep 10
          done
          echo "Public update channel did not reach v${EXPECTED_VERSION}." >&2
          exit 1
